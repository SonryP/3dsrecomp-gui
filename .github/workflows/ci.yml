# builds and tests 3dsrecomp on linux and windows, w/ a C compiler around for the header layout test
name: CI

on:
  push:
  pull_request:
  # a run started by hand from the Actions tab
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --all-features
      - run: cargo test --release --all-features
      # the desktop app, as an exe anyone can download from the run
      - if: runner.os == 'Windows'
        run: cargo build --release -p recomp3ds-gui
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: 3dsrecomp-gui-windows
          path: target/release/3dsrecomp-gui.exe
