[package]
name = "recomp3ds-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "A desktop app for 3dsrecomp, pick a game and build it without the terminal"
build = "build.rs"

[[bin]]
name = "3dsrecomp-gui"
path = "src/main.rs"

[dependencies]
recomp3ds = { path = ".." }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
